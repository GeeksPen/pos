version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pos-backend
    container_name: pos-backend
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      DB_HOST: db
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - pos-network
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pos-frontend
    container_name: pos-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - pos-network

  nginx:
    image: nginx:alpine
    container_name: pos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - pos-network
    depends_on:
      - app
      - frontend

  db:
    image: mysql:8.0
    container_name: pos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-pos_system}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-pos_user}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
